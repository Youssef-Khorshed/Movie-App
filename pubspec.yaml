name: movie_app
description: "Movie app is s new Flutter project is created by code craft."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  auto_size_text: ^3.0.0
  bloc: ^8.1.4
  cupertino_icons: null
  device_preview: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  intl: any
  bloc: ^8.1.4
  flutter_svg: ^2.0.16
  flutter_staggered_grid_view: ^0.7.0
  intl_utils: ^2.6.0
  pin_code_fields: ^8.0.1
  
dev_dependencies:
  build_runner: ^2.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha: true
  adaptive_icon_background: "#D9D9D9"
  adaptive_icon_foreground: "assets/images/app_icon.png"
